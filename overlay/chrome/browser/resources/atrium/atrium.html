<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Atrium</title>
  <!-- Every route's stylesheet, not just the active one: one document serves
       all routes and a per-route <link> would need script to add it, which the
       CSP blocks. The rules are class-scoped, so unused ones cost nothing. -->
  <!-- First: the generated design tokens, so every route's rules can read the
       Swift constants instead of restating them. Regenerated by make tokens;
       make tokens-verify fails when this copy drifts from them. -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="overlay.css">
  <link rel="stylesheet" href="find.css">
  <link rel="stylesheet" href="peek-controls.css">
  <link rel="stylesheet" href="hint.css">
  <link rel="stylesheet" href="edge-glow.css">
  <link rel="stylesheet" href="toast-stack.css">
  <link rel="stylesheet" href="skylight-ambient.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="space-icon-picker.css">
  <link rel="stylesheet" href="archive-fly.css">
  <link rel="stylesheet" href="sidebar-nav-row.css">
  <link rel="stylesheet" href="sidebar-overlay-resize.css">
  <link rel="stylesheet" href="sidebar-ext-strip.css">
  <link rel="stylesheet" href="sidebar-media.css">
  <link rel="stylesheet" href="quickmenu.css">
  <link rel="stylesheet" href="foyer.css">
  <link rel="stylesheet" href="commandbar.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="theme-studio.css">
  <link rel="stylesheet" href="theme-window.css">
  <link rel="stylesheet" href="notes.css">
  <link rel="stylesheet" href="ai-panel.css">
  <link rel="stylesheet" href="overview.css">
  <link rel="stylesheet" href="courtyard.css">
  <link rel="stylesheet" href="devbar.css">
  <link rel="stylesheet" href="permsheet.css">
</head>
<body>
  <!-- Routes render into here. No inline script: the default WebUI CSP is
       script-src chrome://resources 'self', which blocks inline. -->
  <div id="atrium-root"></div>
  <!-- Classic, and before the module: vim-grammar.js publishes a global that
       vim-surface.js reads, and the injected page path loads the same file as
       a string, so it cannot be a module. -->
  <script src="vim-grammar.js"></script>
  <script type="module" src="atrium.js"></script>
</body>
</html>
