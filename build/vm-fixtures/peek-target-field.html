<!doctype html>
<html>
<head><meta charset="utf-8"><title>Peek Target Field</title></head>
<body style="margin:0;padding:40px;font-family:sans-serif;font-size:24px;background:#fdf0d5;">
<p>Escape-in-focused-field test page.</p>
<!-- Escape-in-a-focused-field gate (peek Escape fix): this input calls
     preventDefault() on Escape, matching stock Chromium's own
     Escape-in-a-text-field posture (the browser only gets a "second look"
     at unhandled keys - see PeekWidget::HandleKeyboardEvent). If focus is
     here, Escape must be consumed by the page and NOT dismiss the peek. -->
<input id="field" type="text" style="font-size:24px;padding:8px;width:400px;" placeholder="Focus me, then press Escape">
<p id="marker">preventDefault count: <span id="count">0</span></p>
<script>
  let n = 0;
  document.getElementById('field').addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      n += 1;
      document.getElementById('count').textContent = String(n);
    }
  });
</script>
</body>
</html>
