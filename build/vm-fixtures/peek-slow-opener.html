<!doctype html>
<html>
<head><title>Slow Peek Opener</title></head>
<body style="margin:0; font-family: -apple-system, sans-serif;">
<button id="open" autofocus style="position:fixed; inset:0; width:100%; height:100%;
        border:0; background:#ff0000; color:#fff; font-size:34px;">
Open a page that never answers
</button>
<script>
// A click and a key, as in the sibling popup opener: the recording consent dialog can
// cover the button. The target is non-routable, so the popup never paints.
let opened = false;
function openPopup() {
  if (opened) { return; }
  opened = true;
  window.open('http://10.255.255.1/never-answers', 'slow',
              'width=340,height=380');
}
document.getElementById('open').addEventListener('click', openPopup);
window.addEventListener('keydown', openPopup);
</script>
</body>
</html>
