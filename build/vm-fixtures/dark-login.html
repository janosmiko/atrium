<!doctype html>
<meta charset="utf-8">
<title>Dark Login</title>
<style>
  /* The edges keep moving so the ambilight sampler stays on its fastest rung. */
  @keyframes edge { from { background: #1b1b1b; } to { background: #2a1d33; } }
  body { animation: edge 0.4s steps(4) infinite alternate; }
</style>
<body style="margin:0;height:100vh;background:#1b1b1b;color:#fff;font:20px system-ui;display:flex;align-items:center;justify-content:center">
<div style="background:#2c2c2c;width:440px;height:340px;padding:40px">Sign in</div>
</body>
