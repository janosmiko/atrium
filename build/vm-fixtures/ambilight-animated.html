<!doctype html>
<meta charset="utf-8">
<title>Ambilight Animated</title>
<style>
  @keyframes sweep {
    from { background: #C02020; }
    to   { background: #20C020; }
  }
  .left { flex: 1; animation: sweep 6s linear forwards; }
</style>
<body style="margin:0;height:100vh;display:flex">
<div class="left"></div>
<div style="flex:1;background:#202020"></div>
</body>
