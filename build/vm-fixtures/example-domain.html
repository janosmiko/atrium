<!doctype html>
<meta charset="utf-8">
<title>Example Domain</title>
<style>
  /* Mimics what example.com renders, because scenario pixel assertions were
     measured against that page. A repoint that changed what a tab DRAWS would
     invalidate every region and coordinate measured over it - the failure
     once cost a day of rework across five scenarios. */
  body { background: #fff; margin: 0 auto; max-width: 600px; padding: 1em 2em;
         font-family: -apple-system, system-ui, sans-serif; }
  h1 { font-size: 2em; margin: 3em 0 0.6em; }
  p { font-size: 1em; line-height: 1.4; color: #000; }
  a { color: #38488f; }
</style>
<h1>Example Domain</h1>
<p>This domain is for use in documentation examples without needing permission.
Avoid use in operations.</p>
<p><a href="https://iana.org/domains/example">Learn more</a></p>
