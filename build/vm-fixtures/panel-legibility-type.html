<!doctype html>
<meta charset="utf-8">
<title>Panel Legibility Type</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  /* Big dark type down the left of the page, under where the floating panel
     reveals. A wash the page reads through shows these letters in the rows. */
  .type {
    position: absolute; left: 0; top: 120px; width: 420px;
    font: 900 64px/72px system-ui, sans-serif; color: #111; letter-spacing: -2px;
  }
</style>
<body>
<div class="type">EXPLORE<br>THE<br>THINGS<br>YOU<br>LOVE<br>AGAIN<br>NOW</div>
</body>
