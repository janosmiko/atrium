<!doctype html>
<html>
<head><title>Popup Opener</title></head>
<body style="margin:0; font-family: -apple-system, sans-serif;">
<button id="open" autofocus style="position:fixed; inset:0; width:100%; height:100%;
        border:0; background:#1d3f8f; color:#fff; font-size:34px;">
Open the sign-in popup
</button>
<script>
// Two triggers, one popup. A click alone is not enough: the screen recording
// the scenario starts raises a macOS dialog that floats over the middle of the
// window and eats clicks on those pixels, while keys still reach the page.
let opened = false;
function openPopup() {
  if (opened) { return; }
  opened = true;
  window.open('http://127.0.0.1:8000/popup-target.html',
              'popup-opener', 'width=340,height=380');
}
document.getElementById('open').addEventListener('click', openPopup);
// A keydown handler carries transient activation, so the popup blocker lets
// this through exactly as it does the click.
window.addEventListener('keydown', openPopup);
</script>
</body>
</html>
