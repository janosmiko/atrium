<!doctype html>
<meta charset="utf-8">
<title>White Page Warm Brand</title>
<!-- The reporter's case for a white page carrying a saturated brand
     colour away from its left edge. The sampler takes the warm colour, so the
     window's edge glow is warm while the page the panel floats over stays
     white. A page that is saturated at its own left edge (ambilight-split.html)
     hides the very step this fixture exists to show. -->
<body style="margin:0;height:100vh;background:#FFFFFF">
<div style="height:8vh;background:#FF4500;display:flex;align-items:center;padding-left:30vw;color:#fff;font:700 18px system-ui">brand</div>
<div style="position:absolute;left:35vw;top:30vh;width:40vw;height:40vh;background:#FF5722"></div>
</body>
