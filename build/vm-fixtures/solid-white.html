<!doctype html>
<meta charset="utf-8">
<title>Solid White</title>

<!-- A flat page under the floating panel, so every colour the panel's region
     reads comes from the wash rather than from the page. White is the neutral
     that lets a warm tint and a cool grey land as far apart as they can. -->
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #ffffff; }
</style>
